name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: this workflow only reads the checkout. Declaring it here (not
# just relying on the repo-wide default) means a fork PR's GITHUB_TOKEN stays
# read-only even if the org/repo default is later flipped to write.
permissions:
  contents: read

jobs:
  build-and-test:
    name: Typecheck, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The ffmpeg wrapper and the share-pipeline tests shell out to ffmpeg/ffprobe.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  # The unit suite covers the pure logic well, but everything that touches
  # Electron directly is only exercised end to end. A CI runner cannot be
  # granted macOS Screen Recording, so the capture flows will always skip here.
  # The boot smoke test needs no permissions, and it is the one that catches a
  # renderer that no longer starts, which is the regression a user notices first.
  macos-smoke:
    name: macOS boot smoke test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # e2e/skip-reporter.ts fails the run if every test skips, so a green
      # result here means the boot flow genuinely ran.
      - name: Boot smoke test
        run: npx playwright test e2e/app.spec.ts
